<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Snake: AB Remake</title>
    <style>
        :root {
            --neon: #39ff14; --pink: #ff00ff; --blue: #00f2ff; --bg: #05050a;
        }
        body {
            margin: 0; background: var(--bg); color: white; font-family: 'Orbitron', 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; touch-action: none;
        }
        /* Asosiy menyu */
        #ui-layer {
            position: absolute; width: 340px; height: 340px; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; border: 2px solid var(--blue); box-shadow: 0 0 20px var(--blue);
        }
        .btn-menu {
            padding: 10px 25px; margin: 10px; background: none; border: 2px solid var(--neon);
            color: var(--neon); cursor: pointer; font-weight: bold; text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-menu:hover { background: var(--neon); color: black; box-shadow: 0 0 15px var(--neon); }

        header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .logo-ab {
            width: 40px; height: 40px; border: 2px solid var(--blue); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: 900;
            box-shadow: 0 0 10px var(--blue); animation: spin 4s linear infinite;
        }
        @keyframes spin { 100% { transform: rotateY(360deg); } }

        #game-container { position: relative; border: 3px solid var(--pink); background: #000; }
        canvas { display: block; image-rendering: pixelated; }

        .stats-bar { width: 340px; display: flex; justify-content: space-between; color: var(--neon); font-size: 14px; margin-bottom: 5px; }
        .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 8px; margin-top: 10px; }
        .ctrl-btn {
            width: 60px; height: 60px; border: 2px solid var(--blue); background: rgba(0,242,255,0.1);
            color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .theme-box { display: flex; gap: 10px; margin-top: 10px; }
        .dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid white; }
    </style>
</head>
<body>

    <header>
        <div class="logo-ab">AB</div>
        <div style="letter-spacing: 2px; font-size: 14px;">AZIMXON BAXTIYOROV</div>
    </header>

    <div class="stats-bar">
        <div>OCHKO: <span id="score">0</span></div>
        <div>BOSQICH: <span id="lvl">1</span></div>
        <div>REKORD: <span id="best">0</span></div>
    </div>

    <div id="game-container">
        <!-- Menyular -->
        <div id="ui-layer">
            <h2 id="ui-title" style="color: var(--blue);">CYBER SNAKE</h2>
            <button class="btn-menu" onclick="startGame()">BOSHLASH</button>
            <div style="font-size: 12px; margin-top: 10px;">RANGNI TANLANG:</div>
            <div class="theme-box">
                <div class="dot" style="background: #39ff14;" onclick="setTheme('#39ff14')"></div>
                <div class="dot" style="background: #00f2ff;" onclick="setTheme('#00f2ff')"></div>
                <div class="dot" style="background: #ff00ff;" onclick="setTheme('#ff00ff')"></div>
                <div class="dot" style="background: #ffcf00;" onclick="setTheme('#ffcf00')"></div>
            </div>
        </div>
        <canvas id="snakeGame"></canvas>
    </div>

    <div class="controls">
        <div></div><div class="ctrl-btn" onclick="changeDir('up')">▲</div><div></div>
        <div class="ctrl-btn" onclick="changeDir('left')">◀</div>
        <div class="ctrl-btn" onclick="changeDir('down')">▼</div>
        <div class="ctrl-btn" onclick="changeDir('right')">▶</div>
    </div>

    <script>
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const ui = document.getElementById("ui-layer");
        const scoreEl = document.getElementById("score");
        const lvlEl = document.getElementById("lvl");
        const bestEl = document.getElementById("best");

        const grid = 20;
        canvas.width = 340; canvas.height = 340;

        let snake, food, obstacles, dx, dy, score, level, gameActive = false, snakeColor = '#39ff14';
        let highScore = localStorage.getItem("ab_snake_best") || 0;
        bestEl.innerText = highScore;

        function setTheme(c) { snakeColor = c; }

        function initGame() {
            snake = [{x: 160, y: 160}];
            food = {x: 60, y: 60};
            obstacles = [];
            dx = grid; dy = 0;
            score = 0; level = 1;
            scoreEl.innerText = score; lvlEl.innerText = level;
        }

        function startGame() {
            initGame();
            ui.style.display = "none";
            gameActive = true;
        }

        function createObstacles() {
            obstacles = [];
            if (level > 1) {
                for (let i = 0; i < level * 2; i++) {
                    obstacles.push({
                        x: Math.floor(Math.random() * (canvas.width/grid)) * grid,
                        y: Math.floor(Math.random() * (canvas.height/grid)) * grid
                    });
                }
            }
        }

        function draw() {
            if (!gameActive) return;

            ctx.fillStyle = "rgba(5, 5, 15, 0.3)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // To'siqlar
            ctx.fillStyle = "#ff4444";
            ctx.shadowBlur = 10; ctx.shadowColor = "red";
            obstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, grid-2, grid-2));

            // Ovqat
            ctx.fillStyle = "#fff"; ctx.shadowBlur = 15; ctx.shadowColor = "white";
            ctx.fillRect(food.x, food.y, grid-2, grid-2);

            // Ilon
            snake.forEach((p, i) => {
                ctx.fillStyle = i === 0 ? snakeColor : "rgba(255,255,255,0.3)";
                ctx.shadowBlur = i === 0 ? 20 : 0; ctx.shadowColor = snakeColor;
                ctx.fillRect(p.x, p.y, grid-2, grid-2);
            });

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Devordan o'tish
            if (head.x < 0) head.x = canvas.width - grid;
            if (head.x >= canvas.width) head.x = 0;
            if (head.y < 0) head.y = canvas.height - grid;
            if (head.y >= canvas.height) head.y = 0;

            // To'siqqa urilish yoki o'ziga urilish
            let hitObs = obstacles.some(o => o.x === head.x && o.y === head.y);
            let hitSelf = snake.some(s => s.x === head.x && s.y === head.y);

            if (hitObs || hitSelf) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10; scoreEl.innerText = score;
                if (score % 50 === 0) {
                    level++; lvlEl.innerText = level;
                    createObstacles();
                }
                food = {
                    x: Math.floor(Math.random() * (canvas.width/grid)) * grid,
                    y: Math.floor(Math.random() * (canvas.height/grid)) * grid
                };
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameActive = false;
            ui.style.display = "flex";
            document.getElementById("ui-title").innerText = "O'YIN TUGADI!";
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("ab_snake_best", highScore);
                bestEl.innerText = highScore;
            }
        }

        function changeDir(d) {
            if (d === 'up' && dy === 0) { dx = 0; dy = -grid; }
            if (d === 'down' && dy === 0) { dx = 0; dy = grid; }
            if (d === 'left' && dx === 0) { dx = -grid; dy = 0; }
            if (d === 'right' && dx === 0) { dx = grid; dy = 0; }
        }

        document.onkeydown = (e) => {
            if (e.key === "ArrowUp") changeDir('up');
            if (e.key === "ArrowDown") changeDir('down');
            if (e.key === "ArrowLeft") changeDir('left');
            if (e.key === "ArrowRight") changeDir('right');
        };

        setInterval(draw, 100);
    </script>
</body>
</html>
