<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AB Cyber Snake V2 - Official</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-pink: #ff00ff;
            --cyber-blue: #00f2ff;
            --bg-dark: #05050a;
        }

        body {
            margin: 0; background: var(--bg-dark); color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; touch-action: none;
        }

        /* Neon Logo Animatsiyasi */
        header { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .cyber-logo {
            width: 50px; height: 50px; border: 2px solid var(--cyber-blue);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 22px; box-shadow: 0 0 15px var(--cyber-blue);
            color: var(--cyber-blue); border-radius: 50%;
            animation: rotateLogo 4s linear infinite, neonPulse 1.5s alternate infinite;
        }

        @keyframes rotateLogo { 100% { transform: rotateY(360deg); } }
        @keyframes neonPulse { from { box-shadow: 0 0 10px var(--cyber-blue); } to { box-shadow: 0 0 25px var(--cyber-blue); } }

        #game-box { position: relative; border: 3px solid var(--neon-pink); background: black; transition: transform 0.1s; }
        canvas { display: block; image-rendering: pixelated; }

        .stats {
            width: 100%; max-width: 340px; display: flex; justify-content: space-between;
            font-weight: bold; color: var(--neon-green); margin-bottom: 5px; text-transform: uppercase;
        }

        .controls { display: grid; grid-template-columns: repeat(3, 65px); gap: 10px; margin-top: 15px; }
        .btn {
            width: 65px; height: 65px; background: rgba(0,242,255,0.1);
            border: 2px solid var(--cyber-blue); color: white;
            display: flex; align-items: center; justify-content: center;
            border-radius: 15px; font-size: 24px; cursor: pointer;
        }

        .shake { animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } }
    </style>
</head>
<body>

    <header>
        <div class="cyber-logo">AB</div>
        <div style="text-transform: uppercase; letter-spacing: 2px; font-weight: 900;">Azimxon Baxtiyorov</div>
    </header>

    <div class="stats">
        <div>SCORE: <span id="score">0</span></div>
        <div>BEST: <span id="highScore">0</span></div>
    </div>

    <div id="game-box">
        <canvas id="snakeGame"></canvas>
    </div>

    <div class="controls">
        <div></div><div class="btn" onmousedown="changeDir('up')" ontouchstart="changeDir('up')">▲</div><div></div>
        <div class="btn" onmousedown="changeDir('left')" ontouchstart="changeDir('left')">◀</div>
        <div class="btn" onmousedown="changeDir('down')" ontouchstart="changeDir('down')">▼</div>
        <div class="btn" onmousedown="changeDir('right')" ontouchstart="changeDir('right')">▶</div>
    </div>

    <script>
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highEl = document.getElementById("highScore");
        const gameBox = document.getElementById("game-box");

        const grid = 20;
        canvas.width = 340; canvas.height = 340;

        let score = 0;
        let highScore = localStorage.getItem("ab_snake_high") || 0;
        highEl.innerText = highScore;

        let snake = [{x: 160, y: 160}];
        let food = {x: 80, y: 80};
        let dx = grid, dy = 0;
        let particles = [];
        let speed = 100;

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                this.life = 1;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                this.life -= 0.02;
            }
            draw() {
                ctx.fillStyle = this.color; ctx.globalAlpha = this.life;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) particles.push(new Particle(x, y, color));
        }

        function draw() {
            ctx.fillStyle = "rgba(5, 5, 10, 0.4)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Particles
            particles.forEach((p, i) => {
                p.update(); p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            });

            // Food
            ctx.fillStyle = "#ff00ff"; ctx.shadowBlur = 15; ctx.shadowColor = "#ff00ff";
            ctx.fillRect(food.x, food.y, grid-2, grid-2);

            // Snake
            snake.forEach((p, i) => {
                ctx.fillStyle = i === 0 ? "#39ff14" : "#008000";
                ctx.shadowBlur = i === 0 ? 15 : 0;
                ctx.fillRect(p.x, p.y, grid-2, grid-2);
            });

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0) head.x = canvas.width - grid;
            if (head.x >= canvas.width) head.x = 0;
            if (head.y < 0) head.y = canvas.height - grid;
            if (head.y >= canvas.height) head.y = 0;

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10; scoreEl.innerText = score;
                createParticles(food.x, food.y, "#ff00ff");
                gameBox.classList.add("shake");
                setTimeout(() => gameBox.classList.remove("shake"), 200);
                
                food = {
                    x: Math.floor(Math.random() * (canvas.width/grid)) * grid,
                    y: Math.floor(Math.random() * (canvas.height/grid)) * grid
                };
            } else {
                snake.pop();
            }

            for(let i=1; i<snake.length; i++) {
                if(head.x === snake[i].x && head.y === snake[i].y) {
                    if(score > highScore) {
                        highScore = score; localStorage.setItem("ab_snake_high", highScore);
                        highEl.innerText = highScore;
                    }
                    score = 0; scoreEl.innerText = 0;
                    snake = [{x: 160, y: 160}];
                }
            }
        }

        function changeDir(d) {
            if(d === 'up' && dy === 0) { dx = 0; dy = -grid; }
            if(d === 'down' && dy === 0) { dx = 0; dy = grid; }
            if(d === 'left' && dx === 0) { dx = -grid; dy = 0; }
            if(d === 'right' && dx === 0) { dx = grid; dy = 0; }
        }

        document.onkeydown = (e) => {
            if(e.key === "ArrowUp") changeDir('up');
            if(e.key === "ArrowDown") changeDir('down');
            if(e.key === "ArrowLeft") changeDir('left');
            if(e.key === "ArrowRight") changeDir('right');
        };

        setInterval(draw, speed);
    </script>
</body>
</html>
