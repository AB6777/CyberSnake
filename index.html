<!DOCTYPE html>
<html lang="uz">
<head>
    <!-- Buni <head> qismining eng tepasiga qo'sh (SEO uchun) -->
<meta name="description" content="AB GAMES - Azimxon Baxtiyorovning rasmiy o'yin portali. Cyber Snake va eng vaxshiy o'yinlar to'plami.">
<meta name="keywords" content="AB, AB GAMES, Azimxon Baxtiyorov, Cyber Snake, o'zbekcha o'yinlar, onlayn o'yinlar, AB o'yinlari">
<meta name="author" content="Azimxon Baxtiyorov">

<!-- Robotlar saytni indeks qilishi uchun -->
<meta name="robots" content="index, follow">

<!-- Sening isming qidiruvda chiqishi uchun h1 tegiga e'tibor beramiz -->
<h1 style="display:none;">Azimxon Baxtiyorov - AB GAMES Rasmiy Portali</h1>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AB Cyber Snake: 3d ILON</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root { --neon: #39ff14; --pink: #ff00ff; --blue: #00f2ff; --bg: #020205; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: white; font-family: 'Orbitron', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; perspective: 1000px;
        }

        header { position: absolute; top: 15px; display: flex; align-items: center; gap: 10px; }
        .logo-ab {
            width: 45px; height: 45px; border: 3px solid var(--blue); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: 900;
            box-shadow: 0 0 15px var(--blue); animation: spin 4s linear infinite;
        }
        @keyframes spin { 100% { transform: rotateY(360deg); } }

        #game-wrapper {
            position: relative; border: 4px solid var(--pink); border-radius: 10px;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.2);
            transform: rotateX(10deg); transition: 0.5s;
        }
        canvas { display: block; background: #000; }

        #overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; border-radius: 6px; text-align: center;
        }
        .btn {
            padding: 12px 30px; margin: 10px; background: none; border: 2px solid var(--neon);
            color: var(--neon); font-family: 'Orbitron'; font-weight: 900; cursor: pointer;
            transition: 0.3s; text-transform: uppercase;
        }
        .btn:hover { background: var(--neon); color: black; box-shadow: 0 0 20px var(--neon); }

        .stats { position: absolute; top: -40px; width: 100%; display: flex; justify-content: space-between; color: var(--neon); font-size: 13px; }
        .pad { display: grid; grid-template-columns: repeat(3, 65px); gap: 10px; margin-top: 15px; }
        .key { width: 65px; height: 65px; background: rgba(255,255,255,0.05); border: 2px solid var(--blue); border-radius: 12px; color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; }

        .shake { animation: shake 0.2s linear; }
        @keyframes shake { 0%, 100% { transform: translate(0); } 25% { transform: translate(4px); } 75% { transform: translate(-4px); } }
    </style>
</head>
<body>

    <header>
        <div class="logo-ab">AB</div>
        <div style="letter-spacing: 3px; font-size: 14px; text-shadow: 0 0 10px var(--pink);">AZIMXON BAXTIYOROV</div>
    </header>

    <div id="game-wrapper">
        <div class="stats">
            <div>OCHKO: <span id="sc">0</span></div>
            <div>REKORD: <span id="hi">0</span></div>
        </div>
        
        <div id="overlay">
            <h1 style="color: var(--blue); margin-bottom: 10px; font-size: 22px;">ILON DEMO</h1>
            <p style="font-size: 10px; color: #888; margin-bottom: 15px;"ilon demo</p>
            <button class="btn" onclick="start()">BOSHLASH</button>
        </div>
        <canvas id="c"></canvas>
    </div>

    <div class="pad">
        <div></div><div class="key" onclick="move('up')">▲</div><div></div>
        <div class="key" onclick="move('left')">◀</div><div class="key" onclick="move('down')">▼</div><div class="key" onclick="move('right')">▶</div>
    </div>

    <script>
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        const grid = 20;
        canvas.width = 340; canvas.height = 340;

        let snake, food, obs, dx, dy, score, level, active = false, clr = '#39ff14';
        let hi = localStorage.getItem("hi") || 0;
        document.getElementById("hi").innerText = hi;

        // --- MUSIQA VA OVOZ TIZIMI ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(freq, type, dur, vol) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }

        // Orqa fondagi musiqani (Synthwave ritmi) yaratish
        function playBackgroundMusic() {
            if (!active) return;
            // Oddiy bass ritmi
            playSound(60, 'triangle', 0.5, 0.1);
            setTimeout(() => playSound(80, 'triangle', 0.5, 0.1), 500);
            setTimeout(playBackgroundMusic, 1000);
        }

        function start() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            snake = [{x: 160, y: 160}, {x: 140, y: 160}];
            food = {x: 80, y: 80};
            obs = [];
            dx = grid; dy = 0;
            score = 0; level = 1;
            active = true;
            document.getElementById("overlay").style.display = "none";
            playBackgroundMusic(); // Musiqani boshlash
            loop();
        }

        function move(dir) {
            if(dir=='up' && dy==0) {dx=0; dy=-grid}
            if(dir=='down' && dy==0) {dx=0; dy=grid}
            if(dir=='left' && dx==0) {dx=-grid; dy=0}
            if(dir=='right' && dx==0) {dx=grid; dy=0}
        }

        function loop() {
            if(!active) return;
            setTimeout(() => {
                update();
                draw();
                loop();
            }, Math.max(60, 130 - (level * 5)));
        }

        function update() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if(head.x<0) head.x=320; if(head.x>320) head.x=0;
            if(head.y<0) head.y=320; if(head.y>320) head.y=0;

            if(snake.some(s => s.x==head.x && s.y==head.y) || obs.some(o => o.x==head.x && o.y==head.y)) {
                active = false;
                playSound(100, 'sawtooth', 0.8, 0.2); // Game Over ovozi
                document.getElementById("overlay").style.display = "flex";
                if(score > hi) { hi=score; localStorage.setItem("hi", hi); document.getElementById("hi").innerText=hi; }
                return;
            }

            snake.unshift(head);
            if(head.x==food.x && head.y==food.y) {
                score += 10;
                document.getElementById("sc").innerText = score;
                playSound(800, 'square', 0.1, 0.1); // Ovqat yeyish ovozi
                if(score % 40 == 0) { level++; genObs(); }
                genFood();
                document.getElementById("game-wrapper").classList.add("shake");
                setTimeout(()=>document.getElementById("game-wrapper").classList.remove("shake"), 200);
            } else { snake.pop(); }
        }

        function genFood() { food = { x: Math.floor(Math.random()*16)*20, y: Math.floor(Math.random()*16)*20 }; }
        function genObs() { obs.push({ x: Math.floor(Math.random()*16)*20, y: Math.floor(Math.random()*16)*20 }); }

        function draw() {
            ctx.fillStyle = "black"; ctx.fillRect(0,0,340,340);
            // Ovqat
            ctx.fillStyle = "white"; ctx.shadowBlur = 20; ctx.shadowColor = "white";
            ctx.fillRect(food.x, food.y, 18, 18);
            // To'siqlar
            ctx.fillStyle = "red"; ctx.shadowColor = "red";
            obs.forEach(o => ctx.fillRect(o.x, o.y, 18, 18));
            // Ilon
            snake.forEach((s, i) => {
                ctx.fillStyle = i==0 ? clr : "rgba(255,255,255,0.2)";
                ctx.shadowBlur = i==0 ? 20 : 0; ctx.shadowColor = clr;
                ctx.fillRect(s.x, s.y, 18, 18);
            });
            ctx.shadowBlur = 0;
        }

        window.onkeydown = (e) => {
            if(e.key=="ArrowUp") move('up'); if(e.key=="ArrowDown") move('down');
            if(e.key=="ArrowLeft") move('left'); if(e.key=="ArrowRight") move('right');
        };
    </script>
</body>
</html>
